name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (no data; data-dependent tests skip)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt

      - name: Run tests (skip reasons listed with -rs)
        env:
          PYTHONPATH: src:.
        # Tests marked local_data need git-ignored data or result files (data/raw, data/processed/panel.parquet,
        # results/fair_forecasts.parquet, the saved tuning run, results/interval_forecasts.parquet, results/forecasts.parquet).
        # They are absent in CI, so they skip; -rs prints each skipped test with the missing paths.
        run: python -m pytest -rs

      - name: README result blocks are generated from results/*.csv
        env:
          PYTHONPATH: src:.
        run: python -m mandi.readme_tables --check

  docker:
    name: docker image and API healthcheck (synthetic fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build the image
        run: docker build -t mandi-onion:ci .

      - name: Start the API with the synthetic fixture and wait for the container healthcheck
        run: |
          docker run -d --name api -p 8000:8000 \
            -v "$PWD/tests/fixtures:/app/fixtures:ro" \
            -e MANDI_FORECASTS=/app/fixtures/forecasts_fixture.parquet \
            -e MANDI_RESULTS=/app/fixtures \
            mandi-onion:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api)
            echo "health: $status"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 3
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' api)" = "healthy"

      - name: Query the running API
        run: |
          curl -fsS http://localhost:8000/health
          echo
          curl -fsS "http://localhost:8000/forecast?market=Pune&horizon=7" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['model_spec']=='SYNTHETIC-FIXTURE', d; print('forecast ok:', d['market'], d['horizon'], d['point'])"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8000/forecast?market=Nowhere&horizon=7')" = "422"

      - name: Container logs
        if: always()
        run: docker logs api || true
