[pytest]
pythonpath = src .
testpaths = tests
addopts = --strict-markers
markers =
    local_data(*names): needs data or result files that are not in git; skipped with the missing paths listed when absent
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning
