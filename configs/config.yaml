# All paths, markets, horizons, seeds and model settings live here.
seed: 42

paths:
  raw_file: data/raw/preprocessed_onion_2014_2024_prices_weather_events.parquet
  interim: data/interim
  processed: data/processed
  panel: data/processed/panel.parquet
  results: results
  docs: docs

data:
  state: Maharashtra
  start_date: "2014-01-01"
  end_date: "2024-12-31"
  # Raw columns we use. The file's lag/rolling/climate/price_spike columns are ignored on purpose.
  keep_columns: [date, state, district, market, market_key, variety, arrivals_tonnes,
                 min_price_rs_qtl, max_price_rs_qtl, modal_price_rs_qtl]
  calendar_columns: [is_festival, festival_name, crop_season_onion]
  price_columns: [min_price_rs_qtl, max_price_rs_qtl, modal_price_rs_qtl]

# Chosen markets. Changing the market list is a config edit only.
# The primary variety (most frequent variety in the market) is derived from the data, not set here.
markets:
  - Maharashtra_Sholapur_Solapur
  - Maharashtra_Pune_Pune
  - Maharashtra_Mumbai_Vashi New Mumbai
  - Maharashtra_Kolhapur_Kolhapur
  - Maharashtra_Chattrapati Sambhajinagar_Chattrapati Sambhajinagar

# Reviewer-approved corrections: these (market, date) modal prices are set to missing, never replaced by a
# made-up value. The original stays in modal_price_raw. Each must currently be flagged as an outlier.
corrections:
  - {market_key: Maharashtra_Chattrapati Sambhajinagar_Chattrapati Sambhajinagar, date: "2015-04-30"}
  - {market_key: Maharashtra_Chattrapati Sambhajinagar_Chattrapati Sambhajinagar, date: "2019-12-03"}
  - {market_key: Maharashtra_Chattrapati Sambhajinagar_Chattrapati Sambhajinagar, date: "2024-10-29"}
  - {market_key: Maharashtra_Kolhapur_Kolhapur, date: "2015-06-22"}
  - {market_key: Maharashtra_Kolhapur_Kolhapur, date: "2015-06-23"}
  - {market_key: Maharashtra_Kolhapur_Kolhapur, date: "2023-08-04"}

# Markets always shown in the ranking table, even if they miss the thresholds.
ranking:
  min_observed_days: 2000
  max_gap_days: 90
  always_show: [Maharashtra_Mumbai_Vashi New Mumbai, Maharashtra_Nagpur_Nagpur]

cleaning:
  max_ffill_gap_days: 3        # fill only gaps of at most this many days, only for features, never the target
  stale_run_min_length: 5      # runs of identical (min, max, modal) quotes on consecutive observed days -> is_stale
  outlier:                     # flag only, never auto-correct
    window_days: 31            # centred calendar-day window (15 days either side)
    min_obs: 10                # need at least this many observed days in the window, otherwise no flag
    mad_threshold: 6.0         # flag if |log(price/rolling median)| > threshold * 1.4826 * MAD
    mad_floor_log: 0.02        # MAD floor (in log units) so quiet periods don't flag tiny moves
    min_abs_log_dev: 0.3       # AND the point must be at least this far from the rolling median (0.3 = about +35% / -26%); quotes move in Rs 50-100 steps, so MAD is often 0 and tiny steps would otherwise be flagged
    peer_range_tolerance: 0.25 # review guess: flagged price inside [min, max] of the other markets' same-day prices, widened by this share -> likely real

backtest:
  train_start: "2014-01-01"
  first_test_date: "2020-01-01"
  last_test_date: "2024-12-31"
  horizons_days: [7, 30]

eda:
  train_end: "2019-12-31"      # findings that drive modelling choices may use data up to here only
  min_days_per_week: 3         # weekly mean of observed days needs at least this many observed days
  weekly_fill_weeks: 1         # fill weekly gaps of at most this many weeks (EDA tests only); longer gaps stay missing
  figures_dir: results/figures
  tables_dir: results/eda
  # Known events. precision: day = date from the cited notification/order; month = only the month is cited
  # (placed on the 1st); article = date of the news article, not of the notification. Student verifies all.
  events:
    - {id: E1,  date: "2014-08-21", kind: export, precision: day,     label: "MEP cut to USD 300/t",
       source: "https://globaltradealert.org/intervention/19015-india-reduced-minimum-export-price-on-onions-august-2014"}
    - {id: E2,  date: "2015-08-01", kind: export, precision: month,   label: "MEP raised to USD 700/t",
       source: "https://www.eximguru.com/export-import-news/export-news/commerce-ministry-increases-onion-mep-97557.aspx"}
    - {id: E3,  date: "2015-12-01", kind: export, precision: month,   label: "MEP scrapped",
       source: "https://www.pressreader.com/india/the-financial-express/20160614/281925952293803"}
    - {id: E4,  date: "2017-11-24", kind: export, precision: article, label: "MEP USD 850/t + letter of credit (to 31 Dec 2017)",
       source: "https://www.pressreader.com/india/business-standard/20171124/282321090312436"}
    - {id: E5,  date: "2019-09-29", kind: export, precision: day,     label: "Export ban (DGFT notif. 21/2015-2020)",
       source: "https://eparlib.nic.in/bitstream/123456789/959497/1/AU339.pdf"}
    - {id: E6,  date: "2020-03-15", kind: export, precision: day,     label: "Export ban lifted (DGFT notif. 49/2015-2020; announced 2 Mar)",
       source: "https://english.madhyamam.com/business/2020/mar/3/onions-export-ban-be-lifted-march-15-centre"}
    - {id: E7,  date: "2020-03-25", kind: covid,  precision: day,     label: "National lockdown starts (MHA order of 24 Mar)",
       source: "https://www.scconline.com/blog/post/2020/03/24/breaking-corona-virus-covid-19-india-is-on-a-lockdown-for-21-days-from-midnight-check-the-list-of-things-restricted-and-allowed/"}
    - {id: E8,  date: "2020-06-01", kind: covid,  precision: day,     label: "Unlock 1 begins (MHA guidelines of 30 May)",
       source: "https://www.covidlawlab.org/wp-content/uploads/2020/11/2020-05-30-MHA-Guidelines-to-Fight-COVID-19.pdf"}
    - {id: E9,  date: "2020-09-14", kind: export, precision: day,     label: "Export ban (all varieties)",
       source: "https://old.thefinancialexpress.com.bd/trade/india-bans-onion-exports-1600095980"}
    - {id: E10, date: "2021-01-01", kind: export, precision: day,     label: "Export ban lifted (notified 28 Dec 2020)",
       source: "https://www.udayavani.com/english-news/govt-lifts-export-ban-on-all-varieties-of-onion-from-january-1"}
    - {id: E11, date: "2023-10-28", kind: export, precision: day,     label: "MEP USD 800/t (to 31 Dec 2023)",
       source: "https://www.deccanherald.com/amp/story/business%2Fcentre-imposes-minimum-export-price-of-800-per-tonne-on-onion-till-dec-31-2746354"}
    - {id: E12, date: "2023-12-08", kind: export, precision: day,     label: "Export ban to 31 Mar 2024 (later extended)",
       source: "https://www.theweek.in/wire-updates/business/2024/05/04/del8-biz-ld-onion-exports.html"}
    - {id: E13, date: "2024-05-04", kind: export, precision: day,     label: "Ban lifted, MEP USD 550/t (+40% duty reported)",
       source: "https://www.theweek.in/wire-updates/business/2024/05/04/del8-biz-ld-onion-exports.html"}

forecast:
  # A forecast origin is a calendar day with an observed quote at that market. The target is the quote at
  # origin + h calendar days (h in backtest.horizons_days), scored only if that quote exists.
  features:
    lags_days: [1, 3, 7, 14, 28]          # log change from the last observed quote at or before origin - k
    window_days: 30                       # window for the 30-day mean deviation and the volatility
    cross_market_lags_days: [7, 28]       # other markets' average log change over k days
    max_stale_days_other_market: 7        # ignore another market's latest quote if older than this
  baselines:
    mean_last_k: 3                        # baseline (b): mean of the last 3 observed quotes
    seasonal_period_days: 365             # baseline (c): nearest observed quote within the tolerance of target - 365
    seasonal_tolerance_days: 3
  tuning_folds: [2017, 2018, 2019]        # origins in these years, expanding window; all inside 2014-2019
  retrain_interval: month                 # models are refit on the first day of every month using only data before that day
                                          # (a fit takes 0.1-2.5 s, so monthly is cheap; justified in docs/model_report.md)
  models:                                 # candidates; hyperparameters are chosen on the 2017-2019 tuning folds only
    ets:                                  # state-space exponential smoothing (accepts missing days)
      - {name: local_level, trend: false, damped: false}
      - {name: damped_trend, trend: true, damped: true}
    sarima:
      - {name: "011", order: [0, 1, 1], seasonal_order: [0, 0, 0, 0]}
      - {name: "111", order: [1, 1, 1], seasonal_order: [0, 0, 0, 0]}
      - {name: "111_s7", order: [1, 1, 1], seasonal_order: [1, 0, 0, 7]}
    prophet:                              # weekly seasonality off (EDA: weekday price effects within +-1.8%), yearly on
      - {name: cps0.05, changepoint_prior_scale: 0.05}
      - {name: cps0.3, changepoint_prior_scale: 0.3}
    prophet_anchored:                     # declared before freezing: last observed log price + Prophet's predicted change from origin to target
      - {name: cps0.05, changepoint_prior_scale: 0.05}
      - {name: cps0.3, changepoint_prior_scale: 0.3}
    lgbm:
      learning_rate: 0.03
      grid:
        objective: [l1, huber]
        num_leaves: [8, 16]
        min_child_samples: [20, 60]
        n_estimators: [150, 400]
  selected_models_file: configs/selected_models.yaml   # written by the tuning step, committed before the final run
  runs_dir: results/runs
  # Error analysis by the period of the TARGET date (the date the price is realised). Periods do not overlap.
  event_periods:
    - {name: export_ban_2019_20, group: export_ban, start: "2019-09-29", end: "2020-03-14"}   # E5 to E6
    - {name: covid_lockdown_2020, group: covid, start: "2020-03-25", end: "2020-05-31"}        # E7 to E8
    - {name: export_ban_2020_21, group: export_ban, start: "2020-09-14", end: "2020-12-31"}   # E9 to E10
    - {name: mep_oct_dec_2023, group: mep, start: "2023-10-28", end: "2023-12-07"}            # E11 to E12
    - {name: export_ban_2023_24, group: export_ban, start: "2023-12-08", end: "2024-05-03"}   # E12 to E13
  # Post-hoc feature-group ablation of the frozen LightGBM (not used for any choice).
  ablation_groups:
    calendar: [target_month, target_woy, target_dow, origin_dow, target_expected_closed]
    other_market: [xm_chg_7, xm_chg_28, rel_level]
    mean_reversion: [dev3, dev30]
    days_since_last_quote: [gap_prev]
  # Analysis-only block bootstrap for the macro improvement (no model or selection is changed by it).
  bootstrap: {block_days: 30, resamples: 2000, seed: 42}

# ---------------------------------------------------------------------------------------------------------------
# Phase 4. Methods are declared here before any interval or anomaly result is looked at; no switching afterwards.
intervals:
  # Primary method: rolling split-conformal, symmetric absolute-error quantile on the log scale with the finite-sample
  # correction k = ceil((n + 1) * level), applied to the out-of-sample errors y_log - forecast of the headline LightGBM.
  # Calibration set for a forecast made at origin t: errors of earlier forecasts (same market and horizon) whose target
  # date is strictly before t, within the trailing calibration window, at least min_errors of them.
  primary_method: conformal_abs
  sensitivity_method: conformal_vol_scaled   # errors divided by the origin's volatility scale, then rescaled
  comparator: naive                          # the same procedure applied to naive's errors
  levels: [0.80, 0.95]
  calibration_levels: [0.5, 0.6, 0.7, 0.8, 0.9, 0.95]   # for the calibration plot only
  calibration_window_days: 365
  min_errors: 100
  vol_window_quotes: 30                      # scale = mean absolute log change over the last 30 observed quotes, known at the origin
  seed_with_tuning_forecasts: true           # use the saved 2017-2019 tuning-run forecasts of the frozen LightGBM to fill the first calibration windows
  fan_chart:
    h: 30
    markets: [Pune, Solapur]
    periods:
      - {name: "normal 2022", start: "2022-03-01", end: "2022-08-31"}
      - {name: "export ban 2020-21 (E9-E10)", start: "2020-09-14", end: "2020-12-31"}
      - {name: "export ban 2023-24 (E12-E13)", start: "2023-12-08", end: "2024-05-03"}

anomalies:
  # Detector 1 (retrospective: STL uses future data, so these are historical labels, not real-time alerts).
  stl: {period: 52, robust: true, min_days_per_week: 3}
  mad_threshold: 3.5          # flag if |resid - median| > mad_threshold * mad_scale * MAD
  mad_scale: 1.4826
  # Detector 2 (usable in real time): the realised quote falls outside the interval issued h days earlier.
  surprise: {level: 0.95, horizons: [7, 30]}
  arrivals: {window_days: 30, drop_z: -1.0}    # z-score of arrivals vs the trailing median; "drop" means z <= drop_z
  # Event-period labels use only periods whose both end dates are high-confidence in docs/eda_findings.md.
  # mep_oct_dec_2023 (E11 to the day before E12) was verified by a Deccan Herald article dated 28 Oct 2023 and is high-confidence; it ends 2023-12-07, so it does not overlap the 2023-24 ban.
  high_confidence_periods: [export_ban_2019_20, covid_lockdown_2020, export_ban_2020_21, mep_oct_dec_2023, export_ban_2023_24]
  # Detector 3, `causal_daily` (declared after the first Phase 4 review; run once, no tuning): on OBSERVED quotes only,
  # baseline = median of the log price of the previous `baseline_quotes` observed quotes; scale = mad_scale x MAD of the
  # previous `scale_changes` observed daily log changes; flag if |log p_t - baseline| > k x scale. Uses only data before t.
  causal_daily: {baseline_quotes: 28, scale_changes: 90, k: 4.0}
  # Synthetic test of the detectors (in memory only; never saved to data/). Spikes are multiplicative changes in price.
  synthetic:
    magnitudes: [0.25, 0.40, 0.60]
    directions: [up, down]
    durations_days: [1, 3]
    runs: 20                  # independent random placements per market
    seed: 7
    min_separation_days: 45
    window: ["2020-01-01", "2024-12-31"]
